name: Build Windows Image
run-name: Build ${{ inputs.version || 'latest' }} ${{ inputs.ring }} ${{ inputs.arch }} ${{ inputs.artifact }}

on:
  workflow_dispatch:
    inputs:
      artifact:
        description: Output artifact type
        required: true
        default: iso
        type: choice
        options:
          - iso
          - wim
      arch:
        description: UUP dump architecture
        required: true
        default: amd64
        type: string
      ring:
        description: UUP dump update ring, for example retail or rp
        required: true
        default: rp
        type: string
      pack:
        description: Language pack
        required: true
        default: zh-cn
        type: string
      edition:
        description: Windows edition
        required: true
        default: professional
        type: string
      uuid:
        description: Exact UUP update UUID (optional; must be paired with version)
        required: false
        default: ""
        type: string
      version:
        description: Exact build version (optional; must be paired with uuid)
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Fetch latest UUP package
        env:
          UUP_ARCH: ${{ inputs.arch }}
          UUP_RING: ${{ inputs.ring }}
          UUP_PACK: ${{ inputs.pack }}
          UUP_EDITION: ${{ inputs.edition }}
          UUP_UUID: ${{ inputs.uuid }}
          UUP_VERSION: ${{ inputs.version }}
        run: |
          $fetchArgs = @(
            "-m", "autouupbuild", "fetch",
            "--arch", $env:UUP_ARCH,
            "--ring", $env:UUP_RING,
            "--pack", $env:UUP_PACK,
            "--edition", $env:UUP_EDITION,
            "--output", "."
          )
          if ($env:UUP_UUID -or $env:UUP_VERSION) {
            if (-not $env:UUP_UUID -or -not $env:UUP_VERSION) {
              throw "uuid and version must be provided together."
            }
            $fetchArgs += @("--uuid", $env:UUP_UUID, "--build", $env:UUP_VERSION)
          }
          python @fetchArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure conversion
        run: |
          python -m autouupbuild configure `
            --artifact "${{ inputs.artifact }}" `
            --config ConvertConfig.ini `
            --apps-list CustomAppsList.txt

      - name: Read version
        run: |
          if (-not (Test-Path -Path "version")) {
            throw "version file not found."
          }
          $version = (Get-Content -Path "version" -Raw).Trim()
          if (-not $version) {
            throw "version file is empty."
          }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Run UUP conversion
        shell: cmd
        run: uup_download_windows.cmd

      - name: Prepare ISO artifact
        if: ${{ inputs.artifact == 'iso' }}
        run: |
          $isoFile = Get-ChildItem -Path . -Filter *.iso | Select-Object -First 1
          if (-not $isoFile) {
            throw "ISO file not found."
          }
          $assetSuffix = "${{ inputs.ring }}-${{ inputs.arch }}-${{ inputs.pack }}-${{ inputs.edition }}-${{ inputs.artifact }}" -replace '[^A-Za-z0-9._-]', '-'
          $assetName = "$env:VERSION-$assetSuffix$($isoFile.Extension)"
          "ARTIFACT_PATH=$($isoFile.FullName)" >> $env:GITHUB_ENV
          "RELEASE_ASSET_NAME=$assetName" >> $env:GITHUB_ENV

      - name: Copy install.wim from ISO output
        if: ${{ inputs.artifact == 'iso' }}
        run: |
          $installWimPath = Join-Path (Get-Location) "$env:VERSION.wim"
          $buildFolderWim = Join-Path (Get-Location) "ISOFOLDER\sources\install.wim"

          if (Test-Path -Path $buildFolderWim) {
            Copy-Item -Path $buildFolderWim -Destination $installWimPath -Force
          } else {
            $diskImage = Mount-DiskImage -ImagePath $env:ARTIFACT_PATH -PassThru
            try {
              $volume = $diskImage | Get-Volume | Where-Object { $_.DriveLetter } | Select-Object -First 1
              if (-not $volume) {
                throw "Mounted ISO volume not found."
              }
              $mountedWim = "$($volume.DriveLetter):\sources\install.wim"
              if (-not (Test-Path -Path $mountedWim)) {
                throw "sources\install.wim not found in ISO."
              }
              Copy-Item -Path $mountedWim -Destination $installWimPath -Force
            } finally {
              Dismount-DiskImage -ImagePath $env:ARTIFACT_PATH
            }
          }

          if (-not (Test-Path -Path $installWimPath)) {
            throw "Failed to prepare $env:VERSION.wim."
          }
          "INSTALL_WIM_PATH=$installWimPath" >> $env:GITHUB_ENV
          "INSTALL_WIM_RELEASE_ASSET_NAME=$env:VERSION.wim" >> $env:GITHUB_ENV

      - name: Prepare WIM artifact
        if: ${{ inputs.artifact == 'wim' }}
        run: |
          if (-not (Test-Path -Path "install.wim")) {
            throw "install.wim not found."
          }
          $artifactName = "$env:VERSION.wim"
          $assetSuffix = "${{ inputs.ring }}-${{ inputs.arch }}-${{ inputs.pack }}-${{ inputs.edition }}-${{ inputs.artifact }}" -replace '[^A-Za-z0-9._-]', '-'
          $assetName = "$env:VERSION-$assetSuffix.wim"
          Rename-Item -Path "install.wim" -NewName $artifactName -Force
          "ARTIFACT_PATH=$((Resolve-Path -Path $artifactName).Path)" >> $env:GITHUB_ENV
          "RELEASE_ASSET_NAME=$assetName" >> $env:GITHUB_ENV

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.VERSION }}-${{ inputs.ring }}-${{ inputs.artifact }}
          path: ${{ env.ARTIFACT_PATH }}
          if-no-files-found: error
          archive: false

      - name: Upload install.wim artifact
        if: ${{ inputs.artifact == 'iso' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.VERSION }}.wim
          path: ${{ env.INSTALL_WIM_PATH }}
          if-no-files-found: error
          archive: false

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $maxReleaseAssetBytes = 2147483648
          $notesFile = Join-Path $env:RUNNER_TEMP "release-notes-$env:VERSION.md"
          $releaseNotes = @(
            "AutoUUPBuild $env:VERSION"
            ""
            "Channel: ${{ inputs.ring }}"
            "Artifact: ${{ inputs.artifact }}"
            "Architecture: ${{ inputs.arch }}"
            "Language pack: ${{ inputs.pack }}"
            "Edition: ${{ inputs.edition }}"
            "Workflow run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          ) -join [Environment]::NewLine
          Set-Content -Path $notesFile -Value $releaseNotes -Encoding utf8

          gh release view "$env:VERSION" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create "$env:VERSION" --title "$env:VERSION" --notes-file "$notesFile"
          } else {
            gh release edit "$env:VERSION" --title "$env:VERSION" --notes-file "$notesFile"
          }

          $script:UploadedReleaseAssets = @()
          $script:SkippedReleaseAssets = @()

          function Upload-ReleaseAsset {
            param(
              [Parameter(Mandatory=$true)][string]$AssetPath,
              [Parameter(Mandatory=$true)][string]$AssetName
            )

            $source = Get-Item -LiteralPath $AssetPath
            if ($source.Length -ge $maxReleaseAssetBytes) {
              $sizeGiB = [Math]::Round($source.Length / 1GB, 2)
              $message = "$AssetName is $sizeGiB GiB and exceeds GitHub Release asset limit; kept as Actions artifact only."
              Write-Warning $message
              $script:SkippedReleaseAssets += $message
              return
            }

            $uploadPath = Join-Path $env:RUNNER_TEMP $AssetName
            Copy-Item -LiteralPath $source.FullName -Destination $uploadPath -Force

            $release = gh release view "$env:VERSION" --json assets | ConvertFrom-Json
            $existingAsset = $release.assets | Where-Object { $_.name -eq $AssetName } | Select-Object -First 1
            if ($existingAsset) {
              gh release delete-asset "$env:VERSION" "$AssetName" --yes
            }

            gh release upload "$env:VERSION" "$uploadPath"
            $script:UploadedReleaseAssets += $AssetName
          }

          Upload-ReleaseAsset -AssetPath "$env:ARTIFACT_PATH" -AssetName "$env:RELEASE_ASSET_NAME"

          if ($env:INSTALL_WIM_PATH -and (Test-Path -Path $env:INSTALL_WIM_PATH)) {
            Upload-ReleaseAsset -AssetPath "$env:INSTALL_WIM_PATH" -AssetName "$env:INSTALL_WIM_RELEASE_ASSET_NAME"
          }

          $summary = @(
            "## Release $env:VERSION"
            ""
            "Actions artifacts are uploaded with archive=false."
            ""
          )
          if ($script:UploadedReleaseAssets.Count -gt 0) {
            $summary += "Uploaded release assets:"
            $summary += $script:UploadedReleaseAssets | ForEach-Object { "- $_" }
            $summary += ""
          }
          if ($script:SkippedReleaseAssets.Count -gt 0) {
            $summary += "Skipped release assets:"
            $summary += $script:SkippedReleaseAssets | ForEach-Object { "- $_" }
            $summary += ""
          }
          $summaryText = $summary -join [Environment]::NewLine
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summaryText
          Add-Content -Path $notesFile -Value ([Environment]::NewLine + [Environment]::NewLine + $summaryText)
          gh release edit "$env:VERSION" --title "$env:VERSION" --notes-file "$notesFile"
