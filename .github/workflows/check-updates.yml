name: Check for Windows Image Updates

on:
  schedule:
    - cron: "30 * * * *"
  workflow_dispatch:
    inputs:
      artifact:
        description: Output artifact type to build when a new version is found
        required: true
        default: iso
        type: choice
        options:
          - iso
          - wim
      arch:
        description: UUP dump architecture
        required: true
        default: amd64
        type: string
      ring:
        description: UUP dump update ring, for example retail or rp
        required: true
        default: rp
        type: string
      pack:
        description: Language pack
        required: true
        default: zh-cn
        type: string
      edition:
        description: Windows edition
        required: true
        default: professional
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: check-windows-image-updates
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.latest.outputs.ok }}
      builds: ${{ steps.latest.outputs.builds }}
      artifact: ${{ steps.defaults.outputs.artifact }}
      arch: ${{ steps.defaults.outputs.arch }}
      ring: ${{ steps.defaults.outputs.ring }}
      pack: ${{ steps.defaults.outputs.pack }}
      edition: ${{ steps.defaults.outputs.edition }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set defaults
        id: defaults
        shell: pwsh
        env:
          INPUT_ARTIFACT: ${{ inputs.artifact }}
          INPUT_ARCH: ${{ inputs.arch }}
          INPUT_RING: ${{ inputs.ring }}
          INPUT_PACK: ${{ inputs.pack }}
          INPUT_EDITION: ${{ inputs.edition }}
        run: |
          $artifact = $env:INPUT_ARTIFACT
          $arch = $env:INPUT_ARCH
          $ring = $env:INPUT_RING
          $pack = $env:INPUT_PACK
          $edition = $env:INPUT_EDITION

          if (-not $artifact) { $artifact = "iso" }
          if (-not $arch) { $arch = "amd64" }
          if (-not $ring) { $ring = "rp" }
          if (-not $pack) { $pack = "zh-cn" }
          if (-not $edition) { $edition = "professional" }

          "artifact=$artifact" >> $env:GITHUB_OUTPUT
          "arch=$arch" >> $env:GITHUB_OUTPUT
          "ring=$ring" >> $env:GITHUB_OUTPUT
          "pack=$pack" >> $env:GITHUB_OUTPUT
          "edition=$edition" >> $env:GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m unittest discover -s tests
          node --test tests/test_dispatch.cjs

      - name: Get latest version per branch
        id: latest
        env:
          UUP_ARCH: ${{ steps.defaults.outputs.arch }}
          UUP_RING: ${{ steps.defaults.outputs.ring }}
        run: |
          set +e
          python -m autouupbuild latest \
            --arch "$UUP_ARCH" \
            --ring "$UUP_RING" \
            --all-branches \
            --github-output 2>latest-error.log
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo 'builds=[]' >> "$GITHUB_OUTPUT"
            echo "::warning::Failed to fetch latest UUP build; skipping this check run."
            cat latest-error.log
          fi

      - name: Summarize unavailable upstream
        if: ${{ steps.latest.outputs.ok == 'false' }}
        run: |
          {
            echo "## Update check"
            echo
            echo "Latest fetch failed; no branch builds dispatched."
            echo
            echo '```text'
            cat latest-error.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  dispatch:
    name: Check and dispatch ${{ matrix.build.version }}
    needs: check
    if: ${{ needs.check.outputs.ok == 'true' && needs.check.outputs.builds != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJSON(needs.check.outputs.builds) }}
    steps:
      - name: Check release and dispatch pinned build
        uses: actions/github-script@v8
        env:
          BUILD_VERSION: ${{ matrix.build.version }}
          BUILD_UUID: ${{ matrix.build.uuid }}
          BUILD_TITLE: ${{ matrix.build.title }}
          BUILD_ARTIFACT: ${{ needs.check.outputs.artifact }}
          BUILD_ARCH: ${{ needs.check.outputs.arch }}
          BUILD_RING: ${{ needs.check.outputs.ring }}
          BUILD_PACK: ${{ needs.check.outputs.pack }}
          BUILD_EDITION: ${{ needs.check.outputs.edition }}
          BUILD_REF: ${{ github.ref_name }}
        with:
          script: |
            const version = process.env.BUILD_VERSION;
            const uuid = process.env.BUILD_UUID;
            let published = false;
            try {
              await github.rest.repos.getReleaseByTag({
                ...context.repo,
                tag: version,
              });
              published = true;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            if (!published) {
              await github.rest.actions.createWorkflowDispatch({
                ...context.repo,
                workflow_id: 'build.yml',
                ref: process.env.BUILD_REF,
                inputs: {
                  artifact: process.env.BUILD_ARTIFACT,
                  arch: process.env.BUILD_ARCH,
                  ring: process.env.BUILD_RING,
                  pack: process.env.BUILD_PACK,
                  edition: process.env.BUILD_EDITION,
                  uuid,
                  version,
                },
              });
            }

            core.info(`${version}: ${published ? 'already published' : 'build dispatched'} (${uuid})`);
            await core.summary
              .addHeading(`Update check: ${version}`)
              .addCodeBlock(JSON.stringify({
                title: process.env.BUILD_TITLE,
                version,
                uuid,
                channel: process.env.BUILD_RING,
                releaseExists: published,
                buildDispatched: !published,
              }, null, 2), 'json')
              .write();
